<!DOCTYPE html>
<html>
<head>
    <title>JS Load Test</title>
    <script>
        console.log("=== TEST START ===");
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            document.getElementById("error").innerHTML += "<p style=\"color:red;\">ERROR: " + msg + " at line " + lineNo + ":" + columnNo + "</p>";
            console.error("JS Error:", msg, url, lineNo, columnNo, error);
            return false;
        };
    </script>
</head>
<body>
    <h1>JavaScript Load Test</h1>
    <div id="error"></div>
    <div id="status">Loading JavaScript...</div>
    
    <script src="static/js/dashboard.js"></script>
    
    <script>
        document.getElementById("status").innerHTML = "<p style=\"color:green;\">✅ JavaScript loaded successfully!</p>";
        document.getElementById("status").innerHTML += "<p>CONFIG.API_BASE_URL: " + (typeof CONFIG !== 'undefined' ? CONFIG.API_BASE_URL : "NOT DEFINED") + "</p>";
        document.getElementById("status").innerHTML += "<p>state.currentView: " + (typeof state !== 'undefined' ? state.currentView : "NOT DEFINED") + "</p>";
        console.log("✅ Dashboard.js loaded", {CONFIG, state});
    </script>
</body>
</html>
